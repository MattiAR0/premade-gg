<div class="c-user-picker">
  @if (selected.length > 0) {
  <ul class="c-user-picker__chips">
    @for (user of selected; track user._id) {
    <li class="c-user-picker__chip">
      <span class="c-user-picker__chip-name">{{ user.riotId }}</span>
      @if (user.rank) {
      <span class="c-user-picker__chip-rank">{{ user.rank }}</span>
      }
      <button class="c-user-picker__chip-remove" type="button" (click)="remove(user)"
        [attr.aria-label]="'Quitar a ' + user.riotId">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
          stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>
      </button>
    </li>
    }
  </ul>
  }

  @if (!isFull) {
  <div class="c-user-picker__search">
    <svg class="c-user-picker__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8" /><line x1="21"
        y1="21" x2="16.65" y2="16.65" /></svg>
    <input class="c-user-picker__input" type="text" [(ngModel)]="query" [ngModelOptions]="{ standalone: true }"
      (input)="onInput()" [placeholder]="placeholder" autocomplete="off" />
    @if (searching) {
    <span class="c-user-picker__spinner"></span>
    }

    @if (results.length > 0) {
    <ul class="c-user-picker__results">
      @for (user of results; track user._id) {
      <li>
        <button class="c-user-picker__result" type="button" (click)="add(user)">
          @if (avatarOf(user); as src) {
          <img class="c-user-picker__avatar" [src]="src" alt="" />
          } @else {
          <span class="c-user-picker__avatar c-user-picker__avatar--placeholder">{{ user.riotId.charAt(0).toUpperCase() }}</span>
          }
          <span class="c-user-picker__result-name">{{ user.riotId }}</span>
          @if (user.rank) {
          <span class="c-user-picker__result-meta">{{ user.rank }}</span>
          }
          @if (user.role) {
          <span class="c-user-picker__result-meta">{{ user.role }}</span>
          }
        </button>
      </li>
      }
    </ul>
    }
  </div>
  }
</div>
