<header class="c-navbar">
  <a class="c-navbar__brand" routerLink="/" (click)="closeMenu()" aria-label="PremadeGG, inicio">
    <svg class="c-navbar__logo" width="28" height="28" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M4 4h16l8 8v4l-8 8H12v4H4z" fill="currentColor" />
      <path d="M12 10v8h6l3-3v-2l-3-3z" fill="#0f1923" />
    </svg>
    <span class="c-navbar__brand-text">Premade<span class="c-navbar__accent">GG</span></span>
  </a>

  <button #menuToggle class="c-navbar__toggle" [class.c-navbar__toggle--open]="menuOpen" (click)="toggleMenu()"
    [attr.aria-label]="menuOpen ? 'Cerrar menú' : 'Abrir menú'" [attr.aria-expanded]="menuOpen">
    <span class="c-navbar__toggle-line"></span>
    <span class="c-navbar__toggle-line"></span>
    <span class="c-navbar__toggle-line"></span>
  </button>

  <nav class="c-navbar__nav" [class.c-navbar__nav--open]="menuOpen">
    <div class="c-navbar__links">
      <a class="c-navbar__link" routerLink="/lfg" routerLinkActive="c-navbar__link--active" (click)="closeMenu()">
        Grupos LFG
      </a>
      <a class="c-navbar__link" routerLink="/players" routerLinkActive="c-navbar__link--active" (click)="closeMenu()">
        Jugadores
      </a>
      <a class="c-navbar__link" routerLink="/teams" routerLinkActive="c-navbar__link--active" (click)="closeMenu()">
        Equipos
      </a>
    </div>

    <!-- Auth section -->
    @if (authService.isAuthenticated()) {
    <div class="c-navbar__actions">
      <a class="c-btn c-btn--secondary c-btn--sm c-navbar__cta" routerLink="/lfg" [queryParams]="{ create: 1 }"
        (click)="closeMenu()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
          stroke-linecap="round" aria-hidden="true">
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
        Crear grupo
      </a>
      <div class="c-navbar__icons">
        <app-message-panel />
        <app-notification-bell />
      </div>
      <div class="c-navbar__user-wrap">
        <button #userButton class="c-navbar__user" type="button" (click)="toggleUserMenu()" [attr.aria-expanded]="userMenuOpen">
          @if (avatarUrl) {
          <img class="c-navbar__avatar" [src]="avatarUrl" alt="" />
          } @else {
          <span class="c-navbar__avatar-placeholder">{{ getInitial() }}</span>
          }
          <span class="c-navbar__username">{{ authService.currentUser()?.riotId }}</span>
          <svg class="c-navbar__chevron" [class.c-navbar__chevron--open]="userMenuOpen" width="12" height="12"
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
            <polyline points="6 9 12 15 18 9" />
          </svg>
        </button>

        @if (userMenuOpen) {
        <div class="c-navbar__dropdown">
          <a class="c-navbar__dropdown-item" [routerLink]="['/profile', authService.currentUser()?._id]"
            (click)="closeMenu(); closeUserMenu()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
            Mi perfil
          </a>
          <a class="c-navbar__dropdown-item" routerLink="/messages" (click)="closeMenu(); closeUserMenu()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
            </svg>
            Mensajes
          </a>
          <a class="c-navbar__dropdown-item" routerLink="/settings/profile" (click)="closeMenu(); closeUserMenu()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3" />
              <path
                d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
            </svg>
            Configuración
          </a>
          <button class="c-navbar__dropdown-item c-navbar__dropdown-item--danger" (click)="logout()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            Cerrar sesión
          </button>
        </div>
        }
      </div>
    </div>
    } @else {
    <div class="c-navbar__auth-buttons">
      <a class="c-btn c-btn--ghost c-btn--sm" routerLink="/login" (click)="closeMenu()">Iniciar sesión</a>
      <a class="c-btn c-btn--secondary c-btn--sm" routerLink="/register" (click)="closeMenu()">Registrarse</a>
    </div>
    }
  </nav>

  <!-- Close dropdown on outside click -->
  @if (userMenuOpen) {
  <div class="c-navbar__dropdown-overlay" (click)="closeUserMenu()"></div>
  }

  <div class="c-navbar__overlay" [class.c-navbar__overlay--visible]="menuOpen" (click)="closeMenu()"></div>
</header>
