<div class="c-oauth">
  <button
    class="c-oauth__btn c-oauth__btn--discord"
    type="button"
    [disabled]="loadingProvider !== null"
    (click)="signIn('discord')"
  >
    <svg class="c-oauth__icon" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="currentColor" d="M20.32 4.37A19.8 19.8 0 0 0 15.4 2.8a13.7 13.7 0 0 0-.63 1.3 18.3 18.3 0 0 0-5.5 0 12.6 12.6 0 0 0-.64-1.3 19.7 19.7 0 0 0-4.93 1.57C.59 9.07-.25 13.65.17 18.17a19.9 19.9 0 0 0 6.04 3.05c.49-.66.92-1.37 1.3-2.1a12.9 12.9 0 0 1-2.04-.98c.17-.13.34-.26.5-.4a14.2 14.2 0 0 0 12.06 0l.5.4c-.65.39-1.34.72-2.05.98.38.74.81 1.44 1.3 2.1a19.8 19.8 0 0 0 6.05-3.05c.5-5.24-.84-9.78-3.51-13.8ZM8.02 15.4c-1.18 0-2.15-1.08-2.15-2.42 0-1.33.95-2.42 2.15-2.42 1.2 0 2.17 1.1 2.15 2.42 0 1.34-.95 2.42-2.15 2.42Zm7.96 0c-1.18 0-2.15-1.08-2.15-2.42 0-1.33.95-2.42 2.15-2.42 1.2 0 2.17 1.1 2.15 2.42 0 1.34-.95 2.42-2.15 2.42Z"/>
    </svg>
    {{ loadingProvider === 'discord' ? 'Redirigiendo…' : 'Continuar con Discord' }}
  </button>

  <button
    class="c-oauth__btn c-oauth__btn--google"
    type="button"
    [disabled]="loadingProvider !== null"
    (click)="signIn('google')"
  >
    <svg class="c-oauth__icon" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="#EA4335" d="M12 10.2v3.9h5.4c-.24 1.26-.96 2.33-2.04 3.05l3.3 2.56c1.92-1.77 3.03-4.38 3.03-7.48 0-.72-.06-1.41-.18-2.03H12Z"/>
      <path fill="#34A853" d="M5.84 14.27 5.1 14.84l-2.64 2.05A10 10 0 0 0 12 22.5c2.7 0 4.97-.9 6.62-2.43l-3.3-2.56c-.9.6-2.06.97-3.32.97-2.6 0-4.8-1.75-5.58-4.11l-.58-.1Z"/>
      <path fill="#4A90E2" d="M2.46 7.11A9.9 9.9 0 0 0 1.5 12c0 1.77.42 3.42 1.16 4.89L6.42 13.9a5.9 5.9 0 0 1 0-3.8L2.46 7.11Z"/>
      <path fill="#FBBC05" d="M12 5.98c1.47 0 2.79.5 3.83 1.5l2.86-2.86A9.95 9.95 0 0 0 12 1.5a10 10 0 0 0-9.54 5.61l3.96 3.07C7.2 7.73 9.4 5.98 12 5.98Z"/>
    </svg>
    {{ loadingProvider === 'google' ? 'Redirigiendo…' : 'Continuar con Google' }}
  </button>

  @if (errorMessage) {
    <p class="c-oauth__error" role="alert">{{ errorMessage }}</p>
  }

  <div class="c-oauth__divider"><span>o con email</span></div>
</div>
