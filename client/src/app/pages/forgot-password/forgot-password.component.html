<main class="l-container l-section c-auth-page">
  <div class="c-auth-card">
    <header class="c-auth-card__header">
      <h1 class="c-auth-card__title">¿Olvidaste tu contraseña?</h1>
      <p class="c-auth-card__subtitle">Te enviaremos un enlace para restablecerla</p>
    </header>

    @if (errorMessage) {
      <div class="c-auth-card__error">{{ errorMessage }}</div>
    }

    @if (successMessage) {
      <div class="c-auth-card__success">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        {{ successMessage }}
      </div>
    } @else {
      <form class="c-auth-card__form" (ngSubmit)="onSubmit()">
        <label class="c-auth-card__field">
          <span class="c-auth-card__label">Email de tu cuenta</span>
          <input
            class="c-auth-card__input"
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="tu@email.com"
            autocomplete="email"
            required
          />
        </label>

        <button
          class="c-btn c-btn--primary c-auth-card__submit"
          type="submit"
          [disabled]="loading"
        >
          @if (loading) {
            <span class="c-auth-card__spinner"></span>
            Enviando...
          } @else {
            Enviar enlace de recuperación
          }
        </button>
      </form>
    }

    <footer class="c-auth-card__footer">
      <p>
        <a class="c-auth-card__link" routerLink="/login">Volver al inicio de sesión</a>
      </p>
    </footer>
  </div>
</main>
