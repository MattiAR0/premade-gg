<main class="l-container l-section c-auth-page">
  <div class="c-auth-card">
    <header class="c-auth-card__header">
      <h1 class="c-auth-card__title">Iniciar sesión</h1>
      <p class="c-auth-card__subtitle">Bienvenido de vuelta a Premade<span class="c-auth-card__accent">GG</span></p>
    </header>

    @if (errorMessage) {
      <div class="c-auth-card__error">{{ errorMessage }}</div>
    }

    <form class="c-auth-card__form" (ngSubmit)="onSubmit()">
      <label class="c-auth-card__field">
        <span class="c-auth-card__label">Email</span>
        <input
          class="c-auth-card__input"
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="tu@email.com"
          autocomplete="email"
          required
        />
      </label>

      <label class="c-auth-card__field">
        <span class="c-auth-card__label">Contraseña</span>
        <input
          class="c-auth-card__input"
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        />
      </label>

      <div class="c-auth-card__forgot">
        <a class="c-auth-card__link" routerLink="/forgot-password">¿Olvidaste tu contraseña?</a>
      </div>

      <button
        class="c-btn c-btn--primary c-auth-card__submit"
        type="submit"
        [disabled]="loading"
      >
        @if (loading) {
          <span class="c-auth-card__spinner"></span>
          Entrando...
        } @else {
          Iniciar sesión
        }
      </button>
    </form>

    <footer class="c-auth-card__footer">
      <p>¿No tienes cuenta?
        <a class="c-auth-card__link" routerLink="/register">Regístrate</a>
      </p>
    </footer>
  </div>
</main>
