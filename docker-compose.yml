# ── PremadeGG - Docker Compose ─────────────────────────
# Levanta: MongoDB + API Node.js + Mongo Express
# Uso:  docker-compose up --build
# Seed: docker-compose exec api npm run seed

services:
  # ── Base de Datos ────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: premadegg-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: premade-gg
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"quit(db.adminCommand('ping').ok ? 0 : 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── API Node.js (Express) ───────────────────────────
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: premadegg-api
    ports:
      - "4000:4000"
    volumes:
      # Bind-mount: cambios locales se reflejan en el contenedor (hot-reload)
      - ./server:/app
      # Volume anónimo: protege node_modules del contenedor
      - /app/node_modules
    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://mongo:27017/premade-gg
      PORT: 4000
      RIOT_API_KEY: ${RIOT_API_KEY}
      HENRIK_API_KEY: ${HENRIK_API_KEY}
      JWT_SECRET: ${JWT_SECRET:-premadegg-docker-dev-secret}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM:-"PremadeGG <noreply@premadegg.com>"}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:4200}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  # ── Angular Frontend (nginx + build de producción) ───
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: premadegg-client
    ports:
      - "4200:4200"
    depends_on:
      - api
    restart: unless-stopped

  # ── Mongo Express (UI para la BBDD) ─────────────────
  mongo-express:
    image: mongo-express:latest
    container_name: premadegg-mongo-express
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

# ── Volumes persistentes ──────────────────────────────
volumes:
  mongo-data:
